<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <style>
    :root { --bg: #f7f7f8; --fg: #1f1f1f; --muted: #6b6b6b; --user: #2563eb; --bot: #ffffff; --border: #e3e3e6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #18181b; --fg: #ececec; --muted: #a1a1aa; --user: #3b82f6; --bot: #27272a; --border: #3f3f46; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
           font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 12px 16px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 16px; margin: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
                max-width: 800px; width: 100%; margin: 0 auto; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: var(--user); color: #fff; }
    .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); }
    .error { color: #dc2626; }
    .empty { color: var(--muted); text-align: center; margin-top: 30vh; }
    form { display: flex; gap: 8px; padding: 12px 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
               background: var(--bot); color: var(--fg); font: inherit; }
    button { padding: 0 16px; border: 0; border-radius: 10px; background: var(--user); color: #fff;
             font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #newChat { background: transparent; color: var(--fg); border: 1px solid var(--border); padding: 6px 12px; }
  </style>
</head>
<body>
<header>
  <h1>Chat</h1>
  <button id="newChat" type="button">New chat</button>
</header>

<main id="messages"><p class="empty">Say hello to start the conversation.</p></main>

<form id="form">
  <textarea id="input" rows="2" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)" required></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
  const messages = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // Conversation id (UUIDv7) issued by the server; a new one per chat.
  let sessionId = null;

  async function startSession() {
    const res = await fetch('/api/chat/sessions', { method: 'POST' });
    if (!res.ok) throw new Error('Could not start a chat (' + res.status + ')');
    sessionId = (await res.json()).sessionId;
  }

  function addMessage(role, text) {
    messages.querySelector('.empty')?.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text; // textContent, never innerHTML: model output is untrusted
    messages.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  async function sendMessage(text) {
    addMessage('user', text);
    const bot = addMessage('bot', '…');
    let reply = '';
    sendBtn.disabled = true;

    try {
      if (!sessionId) await startSession();
      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
        body: JSON.stringify({ sessionId, message: text })
      });
      if (!res.ok) throw new Error('Request failed (' + res.status + ')');

      // Parse the Server-Sent Events stream: events are separated by a blank line.
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value.replace(/\r\n/g, '\n');
        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
          const raw = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const { event, data } = parseEvent(raw);
          if (!data) continue;
          const payload = JSON.parse(data);
          if (event === 'token') {
            reply += payload.text;
            bot.textContent = reply;
            messages.scrollTop = messages.scrollHeight;
          } else if (event === 'error') {
            throw new Error(payload.text);
          }
        }
      }
      if (!reply) bot.textContent = '(no reply)';
    } catch (err) {
      bot.textContent = reply ? reply + '\n\n' : '';
      bot.classList.add('error');
      bot.textContent += err.message || 'Something went wrong.';
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function parseEvent(raw) {
    let event = 'message';
    const data = [];
    for (const line of raw.split('\n')) {
      if (line.startsWith('event:')) event = line.slice(6).trim();
      else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
    }
    return { event, data: data.join('\n') };
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    sendMessage(text);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });

  document.getElementById('newChat').addEventListener('click', () => {
    if (sessionId) fetch('/api/chat/' + sessionId, { method: 'DELETE' }).catch(() => {});
    sessionId = null; // a new UUIDv7 is issued when the next message is sent
    messages.innerHTML = '<p class="empty">Say hello to start the conversation.</p>';
    input.focus();
  });
</script>
</body>
</html>
